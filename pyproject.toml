[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-grounding"
version = "0.1.0"
description = "Visual grounding pipeline"
authors = [{name = "Your Name"}]
readme = ""
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "torch",
    "transformers",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]