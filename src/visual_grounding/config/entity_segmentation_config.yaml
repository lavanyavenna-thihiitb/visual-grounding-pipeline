models:
  - type: "sam3"
    name: "facebook/sam3"
    params:
      torch_dtype: "float16"
      trust_remote_code: true
    inference_params:
      score_threshold: 0.30
      use_count_hint: true

model_name: "sam3"

paths:
  # input_folder: "outputs_new"
  input_folder: "/fsxvision_new/jyothi.swaroopa/grounded_captioning_ops/test3.jsonl"
  prompt_path: "src/visual_grounding/prompts/entity_segmentation_prompt.yaml"
  output_folder: "outputs_seg/test.jsonl"  # Writes masks + metadata here

CUDA_DEVICES: "4,5,6,7"
batch_size: 1

# score_threshold: 0.50 - SAM 3 returns a confidence score per mask instance.
# 0.50 is a reasonable default; lower = more recall,
# higher = more precision.

# use_count_hint: true - When Qwen returns {'children': 5}, we keep only the
# top-5 masks by score. When count is -1, keep all above threshold.

